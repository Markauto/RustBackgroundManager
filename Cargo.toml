[package]
name = "bgm"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
description = "Native wallpaper catalog and collection manager for Hyprland and wpaperd"
license = "MIT"

[lib]
name = "bgm"
path = "src/lib.rs"

[[bin]]
name = "bgm"
path = "src/main.rs"

[features]
default = []
rocm = ["dep:burn", "dep:burn-store", "dep:tokenizers"]

[dependencies]
anyhow = "1.0.100"
blake3 = "1.8.2"
burn = { version = "0.21.0", default-features = false, features = ["std", "rocm", "store"], optional = true }
burn-store = { version = "0.21.0", default-features = false, features = ["std", "pytorch"], optional = true }
chrono = { version = "0.4.42", features = ["serde"] }
clap = { version = "4.6.2", features = ["derive", "env", "wrap_help"] }
crossbeam-channel = "0.5.15"
crossterm = "0.29.0"
hex = "0.4.3"
image = { version = "0.25.10", default-features = false, features = ["bmp", "gif", "jpeg", "png", "tiff", "webp"] }
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm", "underline-color"] }
ratatui-image = { version = "11.0.6", default-features = false, features = ["crossterm", "image-defaults", "serde"] }
rusqlite = { version = "0.40.0", features = ["bundled", "chrono", "serde_json", "uuid"] }
rustix = { version = "1.1.4", features = ["fs"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
tempfile = "3.23.0"
toml = "0.9.8"
toml_edit = { version = "0.25.8", features = ["serde"] }
tokenizers = { version = "0.23.1", default-features = false, features = ["onig"], optional = true }
ureq = { version = "2.12.1", default-features = false, features = ["tls"] }
uuid = { version = "1.18.1", features = ["v4", "serde"] }
walkdir = "2.5.0"

[dev-dependencies]
assert_cmd = "2.1.1"
insta = "1.46.1"
predicates = "3.1.3"

[profile.release]
lto = "thin"
strip = true

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
